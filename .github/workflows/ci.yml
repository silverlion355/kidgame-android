name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:  # 手动触发

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./web

      - name: Run ESLint
        run: npm run lint
        working-directory: ./web

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./web

      - name: Run TypeScript check
        run: npx tsc --noEmit
        working-directory: ./web

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./web

      - name: Run unit tests
        run: npm test
        working-directory: ./web

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./web

      - name: Build production
        run: npm run build
        working-directory: ./web

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/dist/
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: ./web

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: ./web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4173

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: web/test-results/
          retention-days: 7

  capacitor-sync:
    name: Capacitor Sync
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./web

      - name: Sync Capacitor
        run: npx cap sync android
        working-directory: ./web
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"

      - name: Upload Android project
        uses: actions/upload-artifact@v4
        with:
          name: android-project
          path: web/android/
          retention-days: 7

  build-debug-apk:
    name: Build Debug APK (no secrets needed)
    runs-on: ubuntu-latest
    needs: [build, capacitor-sync]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./web

      - name: Sync Capacitor (ensure android project exists)
        run: npx cap sync android
        working-directory: ./web
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: web/android/gradle/wrapper/gradle-wrapper.properties

      - name: Build Debug APK
        run: |
          cd web/android
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kidgame-debug-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: [build, capacitor-sync]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./web

      - name: Sync Capacitor (ensure android project exists)
        run: npx cap sync android
        working-directory: ./web
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: web/android/gradle/wrapper/gradle-wrapper.properties

      - name: Decode Keystore
        id: decode_keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ runner.temp }}/release.keystore
          echo "keystore_path=${{ runner.temp }}/release.keystore" >> $GITHUB_OUTPUT

      - name: Configure Gradle Signing
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          cat <<EOF > web/android/key.properties
          storeFile=${{ runner.temp }}/release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build Release APK
        run: |
          cd web/android
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: kidgame-release-apk
          path: web/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Release Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: kidgame-release-aab
          path: web/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30